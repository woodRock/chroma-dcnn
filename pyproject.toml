[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chroma-dcnn"
version = "0.1.0"
description = "1D dilated CNN for GC-MS chromatogram classification with self-supervised pretraining on MoNA/MassBank"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "h5py>=3.10",
    "pandas>=2.2",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "black>=24.0",
    "ruff>=0.4",
]
gcims = [
    # gc-ims-tools for olive oil baseline
    "gc_ims_tools>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "figs"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, bugbear, import order
select = ["E", "W", "F", "B", "I"]
ignore = [
    "B905",  # zip(strict=) — keep py3.9 compatibility
]

[tool.ruff.lint.per-file-ignores]
# Markdown-table templates and aligned data tables read better unwrapped
"scripts/plot_retention_drift.py" = ["E501", "E701", "E702"]
"scripts/09_ablation_1d_vs_2d.py" = ["E501"]
"scripts/10_ablation_tic_only.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs the committed fish-oil data under data/fish_oil",
]

[tool.coverage.run]
source = ["chroma_dcnn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]
