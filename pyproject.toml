[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chroma-dcnn"
version = "0.1.0"
description = "1D dilated CNN for GC-MS chromatogram classification with self-supervised pretraining on MoNA/MassBank"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "h5py>=3.10",
    "pandas>=2.2",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "black>=24.0",
    "ruff>=0.4",
]
gcims = [
    # gc-ims-tools for olive oil baseline
    "gc_ims_tools>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
