model:
  input_type: dense
  patch_size: 50
  max_peaks: 200
  mz_max: 1000
  hidden_dim: 256
  num_layers: 6
  num_heads: 8
  ffn_dim: 1024
  dropout: 0.1

pretraining:
  objective: contrastive
  temperature: 0.1
  projector_dim: 128       # NT-Xent projection head output dim

augmentation:
  intensity_jitter: 0.1    # ± fraction
  low_mass_noise_sigma: 0.02
  low_mass_cutoff: 50      # m/z bins below this get noise injection
  bin_dropout_rate: 0.05   # fraction of bins zeroed

training:
  epochs: 100
  batch_size: 256
  lr: 1.0e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  warmup_epochs: 5
  checkpoint_every: 10
  grad_clip: 1.0

data:
  h5_path: data/pretraining/spectra.h5
  val_fraction: 0.1
  num_workers: 4

logging:
  run_name: contrastive_dense
  checkpoint_dir: checkpoints/contrastive
